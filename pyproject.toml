[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "arsc"
version = "0.1.0"
description = "Fast, R-validated single-cell compute engine (Seurat/harmony/presto/UCell ports) for the autoresearch framework"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "pandas>=2.0",
  "pyarrow>=12",
  "numba>=0.58",
  "scikit-learn>=1.3",
]

[project.optional-dependencies]
graph = ["igraph>=0.10", "leidenalg>=0.10", "umap-learn>=0.5", "pynndescent>=0.5"]
dev = ["pytest>=7", "scanpy", "harmonypy==0.0.10", "anndata"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
arsc = ["R/*.R"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: needs the real datasets / R reference outputs"]
