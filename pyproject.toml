[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "arsc"
version = "0.2.0"
description = "Fast, R-validated single-cell compute engine: memory-mapped stores, Seurat/scanpy/harmony/presto/UCell ports, clonal analysis"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary (private; not yet licensed for redistribution)" }
keywords = ["single-cell", "scRNA-seq", "Seurat", "scanpy", "TCR", "clonotype"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "pandas>=2.0",
  "pyarrow>=12",
  "numba>=0.58",
  "scikit-learn>=1.3",
]

[project.optional-dependencies]
h5ad = ["anndata>=0.10", "h5py>=3.8"]
graph = ["igraph>=0.10", "leidenalg>=0.10", "umap-learn>=0.5", "pynndescent>=0.5"]
all = ["arsc[h5ad,graph]"]
dev = ["arsc[h5ad,graph]", "pytest>=7", "scanpy>=1.10", "harmonypy==0.0.10", "psutil"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
arsc = ["R/*.R"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: needs the real datasets / R reference outputs"]
